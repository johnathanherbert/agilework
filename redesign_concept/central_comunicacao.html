<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mensagens · AgileWork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1013; --surface:#14171b; --surface-2:#191c21; --hover:#1d2127;
    --border:#23272e; --border-strong:#2e333b;
    --text:#e6e8eb; --text-2:#9aa1ab; --text-3:#6b727c;
    --accent:#4c8dff; --accent-weak:rgba(76,141,255,.10);
    --red:#e5484d; --amber:#e2a336; --green:#3fb68b; --violet:#9b87d6;
    --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
    --radius:6px;
  }
  [data-theme="light"]{
    --bg:#f6f7f9; --surface:#ffffff; --surface-2:#fafbfc; --hover:#f1f3f5;
    --border:#e4e7eb; --border-strong:#d3d8de;
    --text:#14171b; --text-2:#5b636e; --text-3:#8a929c;
    --accent:#2563eb; --accent-weak:rgba(37,99,235,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;font-size:13px;background:var(--bg);color:var(--text);
    -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1;overflow:hidden}
  button,input,textarea{font:inherit;color:inherit}
  button{background:none;border:0;cursor:pointer}
  svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  [hidden]{display:none!important}
  .mono{font-family:var(--mono);font-size:12px}

  /* ================= FUNDO ================= */
  .topbar{height:48px;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--surface);position:relative;z-index:10}
  .crumbs{color:var(--text-3)} .crumbs b{color:var(--text);font-weight:500}
  .grow{flex:1}
  .meta{display:flex;align-items:center;gap:14px;color:var(--text-2)}
  .meta .sep{width:1px;height:16px;background:var(--border)}
  .clock{font-family:var(--mono);color:var(--text)}
  .icon-btn{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--text-2);position:relative}
  .icon-btn:hover,.icon-btn.on{background:var(--hover);color:var(--text)}
  .count{position:absolute;top:2px;right:0;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--red);color:#fff;font-size:9.5px;font-weight:600;display:grid;place-items:center;border:2px solid var(--surface)}
  .count.bump{animation:bump .5s ease}
  @keyframes bump{40%{transform:scale(1.35)}}
  .me{width:28px;height:28px;border-radius:50%;background:#2a3038;color:#dfe3e8;display:grid;place-items:center;font-weight:600;font-size:11px}
  .who-btn{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px 0 6px;border-radius:6px;font-size:12px;color:var(--text-3);position:relative}
  .who-btn:hover,.who-btn.on{background:var(--hover);color:var(--text)}
  .avs{display:flex}
  .avs span{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);margin-left:-6px;display:grid;place-items:center;font-size:9px;font-weight:600;background:#2a3038;color:#c9ced6}
  .avs span:first-child{margin-left:0}
  .who-btn .count{top:-5px;right:-7px}
  .bgmain{padding:24px 28px;opacity:.5;pointer-events:none}
  .bgmain h1{font-size:18px;font-weight:600;margin-bottom:16px}
  .ghost{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .ghost div{height:320px;border:1px solid var(--border);border-radius:6px;background:var(--surface)}

  /* ================= PAINEL DE MENSAGENS ================= */
  .cc{position:absolute;top:44px;right:96px;width:400px;height:min(580px,calc(100vh - 60px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;box-shadow:0 16px 40px rgba(0,0,0,.45);z-index:30;overflow:hidden}
  .cc-head{display:flex;align-items:center;gap:10px;padding:12px 12px 0 14px}
  .cc-head h2{font-size:14px;font-weight:600}
  .cc-head .sub{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px}
  .cc-head .sub i{width:6px;height:6px;border-radius:50%;background:var(--green)}
  .cc-head .acts{margin-left:auto;display:flex;gap:2px}
  .cc-head .icon-btn{width:28px;height:28px}
  .cc-head .icon-btn svg{width:15px;height:15px}
  .cc-tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--border)}
  .cc-tab{padding:7px 8px;color:var(--text-3);font-weight:500;font-size:12.5px;position:relative;display:flex;gap:6px;align-items:center}
  .cc-tab:hover,.cc-tab.on{color:var(--text)}
  .cc-tab.on::after{content:"";position:absolute;left:6px;right:6px;bottom:-1px;height:2px;background:var(--text)}
  .cc-tab .n{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
  .cc-tab .n.alert{color:var(--red)}
  .cc-search{padding:10px 12px 6px}
  .search{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--bg);color:var(--text-3)}
  .search input{background:none;border:0;outline:0;color:var(--text);flex:1;min-width:0;font-size:12.5px}
  .search:focus-within{border-color:var(--accent)}
  .search svg{width:14px;height:14px}
  .cc-list{flex:1;overflow:auto;padding-bottom:6px}
  .grp{padding:10px 14px 4px;font-size:11px;font-weight:500;color:var(--text-3);display:flex;justify-content:space-between}

  /* linha de conversa (canal ou pessoa) */
  .row{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:8px 14px;cursor:pointer}
  .row:hover{background:var(--hover)}
  .row .ch{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);display:grid;place-items:center;color:var(--text-3);font-family:var(--mono);font-size:14px}
  .row .txt{min-width:0}
  .row .t1{display:flex;align-items:baseline;gap:6px}
  .row .t1 b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .t1 small{font-size:11.5px;color:var(--text-3);white-space:nowrap}
  .row .t2{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .row.unread .t1 b{font-weight:600}
  .row.unread .t2{color:var(--text-2)}
  .row .end{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .row .end time{font-family:var(--mono);font-size:11px;color:var(--text-3)}
  .row.unread .end time{color:var(--text)}
  .badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--text);color:var(--bg);font-size:10.5px;font-weight:600;display:grid;place-items:center;font-family:var(--mono)}
  .badge.mention{background:var(--accent);color:#fff}
  .muted-ic{color:var(--text-3)} .muted-ic svg{width:12px;height:12px}

  .av{width:30px;height:30px;border-radius:50%;background:#2a3038;color:#c9ced6;display:grid;place-items:center;font-size:11px;font-weight:600;flex-shrink:0;position:relative}
  [data-theme="light"] .av{background:#e4e7eb;color:#3b424b}
  .av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;border:2px solid var(--surface);background:transparent}
  .av.on::after{background:var(--green)}
  .av.away::after{background:var(--amber)}
  .av.sm{width:26px;height:26px;font-size:10px}
  .av.sm::after{width:8px;height:8px}
  .av.nodot::after{display:none}
  .role{font-size:11.5px;color:var(--text-3)}
  .empty{padding:32px 20px;text-align:center;color:var(--text-3);line-height:1.5}

  /* ================= CONVERSA ================= */
  .cv{position:absolute;inset:0;background:var(--surface);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .16s ease}
  .cv.show{transform:none}
  .cv-head{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 8px;border-bottom:1px solid var(--border)}
  .cv-head .ttl{min-width:0;flex:1}
  .cv-head b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cv-head small{display:block;font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cv-head .ch{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);display:grid;place-items:center;color:var(--text-3);font-family:var(--mono);font-size:13px}
  .msgs{flex:1;overflow:auto;padding:6px 0 10px}
  .day{display:flex;align-items:center;gap:10px;padding:10px 14px 4px;font-size:11px;color:var(--text-3)}
  .day::before,.day::after{content:"";flex:1;height:1px;background:var(--border)}
  .m{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:4px 14px}
  .m:hover{background:var(--surface-2)}
  .m.cont{padding-top:0}
  .m.cont .av{visibility:hidden;height:0}
  .m .hd{display:flex;align-items:baseline;gap:8px}
  .m .hd b{font-weight:600;font-size:12.5px}
  .m .hd time{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
  .m .hd .you{font-size:11px;color:var(--text-3)}
  .m .bd{font-size:13px;line-height:1.5;color:var(--text);word-wrap:break-word;white-space:pre-wrap}
  .m.mine .bd{color:var(--text)}
  .m .bd .nt{font-family:var(--mono);font-size:11.5px;padding:0 4px;border:1px solid var(--border-strong);border-radius:3px;color:var(--text);cursor:pointer}
  .m .bd .nt:hover{border-color:var(--accent);color:var(--accent)}
  .m .bd .at{color:var(--accent);font-weight:500}
  .m .bd .at.self{background:var(--accent-weak);border-radius:3px;padding:0 2px}
  .m .st{font-size:10.5px;color:var(--text-3);margin-top:1px}
  .m.sending .bd{opacity:.6}
  .sys{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:6px 14px}
  .sys .ic{width:26px;display:grid;place-items:center;color:var(--text-3)}
  .sys .ic i{width:7px;height:7px;border-radius:50%}
  .sys .card{border:1px solid var(--border);border-radius:6px;padding:8px 10px;background:var(--surface-2);font-size:12.5px;line-height:1.45}
  .sys .card b{font-weight:500}
  .sys .card small{display:block;font-size:11px;color:var(--text-3);margin-top:2px;font-family:var(--mono)}
  .sys .card a{color:var(--accent);font-size:12px;cursor:pointer}
  .new-sep{display:flex;align-items:center;gap:10px;padding:6px 14px;font-size:11px;color:var(--red);font-weight:500}
  .new-sep::after{content:"";flex:1;height:1px;background:var(--red);opacity:.5}
  .typing{padding:0 14px 6px 50px;font-size:11.5px;color:var(--text-3);height:20px}
  .typing span{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--text-3);margin-right:2px;animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

  /* compositor */
  .comp{border-top:1px solid var(--border);padding:8px 10px 10px}
  .quick{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto}
  .quick button{height:24px;padding:0 8px;border:1px solid var(--border-strong);border-radius:12px;font-size:11.5px;color:var(--text-2);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
  .quick button:hover{color:var(--text);border-color:var(--text-3)}
  .quick svg{width:12px;height:12px}
  .box{display:flex;align-items:flex-end;gap:6px;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--bg);padding:6px 6px 6px 10px}
  .box:focus-within{border-color:var(--accent)}
  .box textarea{flex:1;min-height:20px;max-height:120px;resize:none;border:0;outline:0;background:none;line-height:1.5;font-size:13px;padding:1px 0}
  .box textarea::placeholder{color:var(--text-3)}
  .send{width:28px;height:28px;border-radius:5px;display:grid;place-items:center;background:var(--text);color:var(--bg)}
  .send:disabled{background:var(--border-strong);color:var(--text-3);cursor:default}
  .send svg{width:14px;height:14px}
  .hint{display:flex;justify-content:space-between;margin-top:5px;font-size:10.5px;color:var(--text-3)}
  kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--border-strong);border-radius:3px;padding:0 3px}
  .mention-pop{position:absolute;left:10px;right:10px;bottom:100%;margin-bottom:4px;background:var(--surface);border:1px solid var(--border-strong);border-radius:6px;box-shadow:0 10px 26px rgba(0,0,0,.35);padding:4px 0;max-height:190px;overflow:auto}
  .mention-pop .it{display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;font-size:12.5px}
  .mention-pop .it:hover,.mention-pop .it.on{background:var(--hover)}
  .mention-pop .it small{margin-left:auto;font-size:11px;color:var(--text-3)}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:6px;font-weight:500;opacity:0;transition:.2s;pointer-events:none;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px;border:3px solid transparent;background-clip:content-box}
  @media (max-width:520px){ .cc{right:8px;left:8px;width:auto} }
</style>
</head>
<body>

<!-- ================= BARRA SUPERIOR (contexto) ================= -->
<header class="topbar">
  <div class="crumbs">Pesagem <span>/</span> <b>Painel de produção</b></div>
  <div class="grow"></div>
  <div class="meta">
    <span style="font-size:12px" id="shiftLbl"></span>
    <span class="clock" id="clock">--:--:--</span>
    <span id="date"></span>
    <span class="sep"></span>
    <button class="who-btn" id="ccBtn" title="Mensagens (M)"><div class="avs" id="onAvs"></div><span id="onCount"></span><span class="count" id="ccCount" hidden></span></button>
    <span class="sep"></span>
    <button class="icon-btn" title="Notificações"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></button>
    <button class="icon-btn" id="themeBtn" title="Alternar tema"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <div class="me" title="Johnathan Almeida">JA</div>
  </div>

  <!-- ================= PAINEL ================= -->
  <section class="cc" id="cc" hidden role="dialog" aria-label="Mensagens">
    <div class="cc-head">
      <div><h2>Mensagens</h2><div class="sub"><i></i><span id="ccSub"></span></div></div>
      <div class="acts">
        <button class="icon-btn" id="soundBtn" title="Som das mensagens"></button>
        <button class="icon-btn" id="ccClose" title="Fechar (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
    </div>
    <div class="cc-tabs" id="ccTabs"></div>
    <div class="cc-search"><label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Buscar canal ou colaborador"></label></div>
    <div class="cc-list" id="list"></div>

    <!-- Conversa -->
    <div class="cv" id="cv">
      <div class="cv-head" id="cvHead"></div>
      <div class="msgs" id="msgs"></div>
      <div class="typing" id="typing"></div>
      <div class="comp" style="position:relative">
        <div class="mention-pop" id="mPop" hidden></div>
        <div class="quick" id="quick"></div>
        <div class="box">
          <textarea id="inp" rows="1" placeholder="Mensagem"></textarea>
          <button class="send" id="sendBtn" title="Enviar (Enter)" disabled><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
        <div class="hint"><span><kbd>Enter</kbd> envia · <kbd>Shift</kbd>+<kbd>Enter</kbd> quebra linha · <kbd>@</kbd> menciona</span><span id="chars"></span></div>
      </div>
    </div>
  </section>
</header>

<div class="bgmain"><h1>Painel de produção</h1><div class="ghost"><div></div><div></div><div></div></div></div>
<div class="toast" id="toast"></div>

<script>
/* Mostra qualquer erro na tela em vez de deixar a página vazia */
window.addEventListener('error',function(e){
  var b=document.getElementById('errBanner');
  if(!b){ b=document.createElement('div'); b.id='errBanner';
    b.style.cssText='position:fixed;left:16px;right:16px;bottom:16px;z-index:99;background:#2a1215;border:1px solid #e5484d;color:#ffd7d9;padding:10px 14px;border-radius:6px;font:12px/1.5 monospace;white-space:pre-wrap';
    document.body.appendChild(b); }
  b.textContent='Erro na tela: '+(e.message||e)+(e.lineno?'  (linha '+e.lineno+')':'');
});
var store={ get:function(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } },
            set:function(k,v){ try{ window.localStorage.setItem(k,v); }catch(e){} } };
function $(id){ return document.getElementById(id); }
function pad(n){ return (n<10?'0':'')+n; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function ini(n){ var p=n.split(' '); return (p[0][0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase(); }
function hm(d){ return pad(d.getHours())+':'+pad(d.getMinutes()); }
function toast(m){ var t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},1800); }
var DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'], MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function when(d){
  var now=new Date(), y=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);
  if(d.toDateString()===now.toDateString()) return hm(d);
  if(d.toDateString()===y.toDateString()) return 'ontem';
  var dd=Math.floor((now-d)/86400000); if(dd<7) return DIAS[d.getDay()];
  return pad(d.getDate())+'/'+pad(d.getMonth()+1);
}
function dayLbl(d){
  var now=new Date(), y=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);
  if(d.toDateString()===now.toDateString()) return 'Hoje';
  if(d.toDateString()===y.toDateString()) return 'Ontem';
  return DIAS[d.getDay()]+', '+d.getDate()+' '+MES[d.getMonth()];
}
function lastSeen(d){
  var m=(Date.now()-d)/60000;
  if(m<60) return 'visto há '+Math.max(1,Math.floor(m))+' min';
  if(m<1440) return 'visto hoje '+hm(d);
  var dd=Math.floor(m/1440); return 'visto há '+dd+' dia'+(dd>1?'s':'');
}

/* ================= CONFIGURAÇÃO ================= */
var SHIFTS=[{n:3,l:'3º turno',a:[23,45],b:[7,20]},{n:1,l:'1º turno',a:[7,20],b:[15,50]},{n:2,l:'2º turno',a:[15,50],b:[23,45]}];
function curShift(){ var d=new Date(), t=d.getHours()*60+d.getMinutes();
  for(var i=0;i<SHIFTS.length;i++){ var s=SHIFTS[i], a=s.a[0]*60+s.a[1], b=s.b[0]*60+s.b[1], len=(b-a+1440)%1440, el=(t-a+1440)%1440; if(el<len) return {s:s,el:el,len:len}; } return null; }

/* ================= DADOS DE EXEMPLO (substituir pela API / WebSocket) ================= */
var ME='ja';
function ago(min){ return new Date(Date.now()-min*60000); }
var PEOPLE={
  ja:{name:'Johnathan Almeida', role:'Líder pesagem', st:'on'},
  dm:{name:'Diego Marialva',    role:'Líder · 1º turno', st:'on'},
  lb:{name:'Leonardo Bastos',   role:'Operador pesagem', st:'on'},
  li:{name:'Luan Italo',        role:'Operador pesagem', st:'away'},
  vv:{name:'Vanessa Vanderlei', role:'Gestora', st:'off', seen:ago(95)},
  as:{name:'Alessandro Simas',  role:'Líder · 2º turno', st:'off', seen:ago(60*16)},
  ws:{name:'Willace Santos',    role:'Líder · 3º turno', st:'off', seen:ago(60*9)},
  mh:{name:'Matheus Henrique',  role:'Operador pesagem', st:'off', seen:ago(40)},
  ro:{name:'Renato Oliveira',   role:'Almoxarifado', st:'off', seen:ago(25)},
  ar:{name:'Airton Reis',       role:'Operador pesagem', st:'off', seen:ago(60*24*24)},
  ac:{name:'Airton Da Silva Costa', role:'Operador pesagem', st:'off', seen:ago(60*24*38)}
};
var CONVS=[
  {id:'geral', type:'ch', name:'geral', desc:'Comunicação aberta para toda a fábrica', members:38, msgs:[
    {u:'vv',at:ago(60*26),tx:'Bom dia. Auditoria interna amanhã às 9h na pesagem, manter as barricas identificadas.'},
    {u:'dm',at:ago(60*3),tx:'Ciente. Reforcei com o 1º turno.'},
    {u:'lb',at:ago(18),tx:'Balança 3 calibrada e liberada.'}], read:2},
  {id:'prod', type:'ch', name:'linha-de-producao', desc:'Heijunka, rotas e turnos', members:24, msgs:[
    {sys:true,c:'var(--text-3)',at:ago(60*5),tx:'<b>3º turno encerrado</b>: 11/13 ordens (85%) · PD/PA 6/7',meta:'Painel de produção'},
    {u:'ws',at:ago(60*5-3),tx:'Rosuvastatina ficou 1/3, faltou granulado. Passei o saldo para o 1º turno.'},
    {sys:true,c:'var(--red)',at:ago(40),tx:'<b>1º turno abaixo do ritmo</b>: 7% realizado com 55% do turno decorrido',meta:'Alerta automático',go:'Abrir painel'},
    {u:'dm',at:ago(35),tx:'@Johnathan a COP LEG.12 parou para limpeza, volta em 30 min. Vou priorizar a Nimesulida na FET.3.'},
    {u:'li',at:ago(6),tx:'Desvenlafaxina 1/3 pesada. Seguindo.'}], read:2, mention:true},
  {id:'alm', type:'ch', name:'almoxarifado-e-nts', desc:'Status de materiais e notas técnicas', members:15, msgs:[
    {u:'mh',at:ago(60*2),tx:'Criei a NT 692433 para croscarmelose e estearato.'},
    {u:'ro',at:ago(12),tx:'NT 692433 separada, subindo agora.'},
    {u:'ro',at:ago(5),tx:'011689 sulfato de cálcio pago também.'}], read:1, muted:false},
  {id:'dm', type:'dm', with:'dm', msgs:[
    {u:'ja',at:ago(60*20),tx:'Diego, consegue fechar a escala da turma D amanhã?'},
    {u:'dm',at:ago(60*19),tx:'Fecho sim, te mando até 14h.'},
    {u:'dm',at:ago(9),tx:'Escala da D pronta, faltam só 2 atestados para lançar.'}], read:2},
  {id:'lb', type:'dm', with:'lb', msgs:[
    {u:'lb',at:ago(60*2),tx:'Posso pegar a folga flexível na sexta?'},
    {u:'ja',at:ago(60*2-4),tx:'Pode, lança no sistema que eu aprovo.'}], read:2},
  {id:'vv', type:'dm', with:'vv', msgs:[
    {u:'vv',at:ago(60*24*2),tx:'Johnathan, manda o % PD/PA da semana quando puder.'},
    {u:'ja',at:ago(60*24*2-30),tx:'Enviado: 51% nos últimos 30 dias, +7,1 pp.'}], read:2}
];

/* ================= ESTADO ================= */
var tab=store.get('cc_tab')||'ch', open=null, q='', sound=store.get('cc_sound')!=='0';

function conv(id){ for(var i=0;i<CONVS.length;i++) if(CONVS[i].id===id) return CONVS[i]; return null; }
function unreadOf(c){ return Math.max(0,c.msgs.length-c.read); }
function lastOf(c){ return c.msgs[c.msgs.length-1]; }
function dmWith(uid){ for(var i=0;i<CONVS.length;i++) if(CONVS[i].type==='dm'&&CONVS[i].with===uid) return CONVS[i]; return null; }
function onlineList(){ return Object.keys(PEOPLE).filter(function(k){ return k!==ME && PEOPLE[k].st!=='off'; }); }
function totalUnread(){ return CONVS.reduce(function(a,c){ return a+(c.muted?0:unreadOf(c)); },0); }

/* ================= TOPO ================= */
function renderTop(){
  var on=onlineList();
  $('onAvs').innerHTML=on.slice(0,3).map(function(k){ return '<span title="'+esc(PEOPLE[k].name)+'">'+ini(PEOPLE[k].name)+'</span>'; }).join('');
  $('onCount').textContent=on.length+' online';
  var u=totalUnread(); $('ccCount').hidden=!u; $('ccCount').textContent=u>9?'9+':u;
  document.title=(u?'('+u+') ':'')+'Mensagens · AgileWork';
}
function tick(){ var n=new Date(), c=curShift(); $('clock').textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
  $('date').textContent=DIAS[n.getDay()]+', '+n.getDate()+' '+MES[n.getMonth()]; $('shiftLbl').textContent=c?c.s.l:''; }

/* ================= LISTA ================= */
function preview(m){
  if(!m) return 'Sem mensagens';
  var t=m.tx.replace(/<[^>]+>/g,'');
  if(m.sys) return t;
  return (m.u===ME?'Você: ':(PEOPLE[m.u]?PEOPLE[m.u].name.split(' ')[0]+': ':''))+t;
}
function renderTabs(){
  var uc=CONVS.filter(function(c){return c.type==='ch';}).reduce(function(a,c){return a+(c.muted?0:unreadOf(c));},0);
  var ud=CONVS.filter(function(c){return c.type==='dm';}).reduce(function(a,c){return a+unreadOf(c);},0);
  $('ccTabs').innerHTML=
    '<button class="cc-tab'+(tab==='ch'?' on':'')+'" data-t="ch">Canais'+(uc?'<span class="n alert">'+uc+'</span>':'')+'</button>'+
    '<button class="cc-tab'+(tab==='dm'?' on':'')+'" data-t="dm">Diretas'+(ud?'<span class="n alert">'+ud+'</span>':'')+'</button>';
  $('q').placeholder = tab==='ch' ? 'Buscar canal' : 'Buscar colaborador';
  var on=onlineList().length; $('ccSub').textContent=on+' colaborador'+(on>1?'es':'')+' online';
}
function rowCh(c){
  var u=unreadOf(c), l=lastOf(c), men=c.mention&&u;
  return '<div class="row'+(u&&!c.muted?' unread':'')+'" data-open="'+c.id+'"><span class="ch">#</span>'+
    '<div class="txt"><div class="t1"><b>'+esc(c.name)+'</b>'+(c.muted?'<span class="muted-ic" title="Silenciado"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM23 9l-6 6M17 9l6 6"/></svg></span>':'')+'</div>'+
    '<div class="t2">'+esc(u?preview(l):c.desc)+'</div></div>'+
    '<div class="end"><time>'+(l?when(l.at):'')+'</time>'+(u&&!c.muted?'<span class="badge'+(men?' mention':'')+'" title="'+(men?'Você foi mencionado':'')+'">'+(men?'@':u)+'</span>':'')+'</div></div>';
}
function rowP(k){
  var p=PEOPLE[k], c=dmWith(k), u=c?unreadOf(c):0, l=c?lastOf(c):null;
  var sub = l ? preview(l) : (p.st==='on'?'Online':p.st==='away'?'Ausente':lastSeen(p.seen));
  return '<div class="row'+(u?' unread':'')+'" data-person="'+k+'"><span class="av '+(p.st==='on'?'on':p.st==='away'?'away':'')+'">'+ini(p.name)+'</span>'+
    '<div class="txt"><div class="t1"><b>'+esc(p.name)+'</b><small>'+esc(p.role)+'</small></div><div class="t2">'+esc(sub)+'</div></div>'+
    '<div class="end">'+(l?'<time>'+when(l.at)+'</time>':'')+(u?'<span class="badge">'+u+'</span>':'')+'</div></div>';
}
function renderList(){
  renderTabs();
  var s=q.toLowerCase(), h='';
  if(tab==='ch'){
    var ch=CONVS.filter(function(c){ return c.type==='ch' && (!s || c.name.indexOf(s)>=0 || c.desc.toLowerCase().indexOf(s)>=0); });
    h = ch.length ? '<div class="grp"><span>Canais da fábrica</span><span>'+ch.length+'</span></div>'+ch.map(rowCh).join('') : '<div class="empty">Nenhum canal encontrado.</div>';
  } else {
    var ks=Object.keys(PEOPLE).filter(function(k){ return k!==ME && (!s || PEOPLE[k].name.toLowerCase().indexOf(s)>=0 || PEOPLE[k].role.toLowerCase().indexOf(s)>=0); });
    var recent=ks.filter(function(k){ return dmWith(k); }).sort(function(a,b){ return lastOf(dmWith(b)).at-lastOf(dmWith(a)).at; });
    var rest=ks.filter(function(k){ return !dmWith(k); });
    var on=rest.filter(function(k){return PEOPLE[k].st!=='off';}), off=rest.filter(function(k){return PEOPLE[k].st==='off';}).sort(function(a,b){ return PEOPLE[b].seen-PEOPLE[a].seen; });
    if(recent.length) h+='<div class="grp"><span>Conversas recentes</span></div>'+recent.map(rowP).join('');
    if(on.length) h+='<div class="grp"><span>Online agora</span><span>'+on.length+'</span></div>'+on.map(rowP).join('');
    if(off.length) h+='<div class="grp"><span>Offline</span><span>'+off.length+'</span></div>'+off.map(rowP).join('');
    if(!h) h='<div class="empty">Ninguém encontrado com “'+esc(q)+'”.</div>';
  }
  $('list').innerHTML=h;
}

/* ================= CONVERSA ================= */
function fmt(tx){
  var h=esc(tx);
  h=h.replace(/\b(NT\s?)?(\d{6}|\d{10})\b/g,function(m,p,code){ return (p||'')+'<span class="nt" data-code="'+code+'" title="Abrir / copiar">'+code+'</span>'; });
  h=h.replace(/@([A-ZÀ-Ú][\wÀ-ú]+)/g,function(m,n){ var mine=PEOPLE[ME].name.split(' ')[0]===n; return '<span class="at'+(mine?' self':'')+'">@'+n+'</span>'; });
  return h;
}
function openConv(id){
  var c=conv(id); if(!c) return; open=id;
  var firstUnread=c.read, u=unreadOf(c);
  var head='';
  if(c.type==='ch'){
    head='<span class="ch">#</span><div class="ttl"><b>'+esc(c.name)+'</b><small>'+c.members+' membros · '+esc(c.desc)+'</small></div>'+
      '<button class="icon-btn" id="muteBtn" title="'+(c.muted?'Reativar notificações':'Silenciar canal')+'">'+(c.muted?svgMute():svgBell())+'</button>';
  } else {
    var p=PEOPLE[c.with];
    head='<span class="av sm '+(p.st==='on'?'on':p.st==='away'?'away':'')+'">'+ini(p.name)+'</span><div class="ttl"><b>'+esc(p.name)+'</b><small>'+esc(p.role)+' · '+(p.st==='on'?'online':p.st==='away'?'ausente':lastSeen(p.seen))+'</small></div>';
  }
  $('cvHead').innerHTML='<button class="icon-btn" id="backBtn" title="Voltar (Esc)"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>'+head;
  renderMsgs(u?firstUnread:-1);
  c.read=c.msgs.length; renderTop();
  renderQuick(c);
  $('cv').classList.add('show');
  $('inp').placeholder = c.type==='ch' ? 'Mensagem em #'+c.name : 'Mensagem para '+PEOPLE[c.with].name.split(' ')[0];
  $('inp').value=store.get('cc_draft_'+id)||''; autosize(); syncSend();
  setTimeout(function(){ $('inp').focus(); },170);
}
function renderMsgs(newIdx){
  var c=conv(open), h='', lastDay='', prev=null;
  c.msgs.forEach(function(m,i){
    var dl=dayLbl(m.at); if(dl!==lastDay){ h+='<div class="day">'+dl+'</div>'; lastDay=dl; prev=null; }
    if(i===newIdx) { h+='<div class="new-sep">Novas</div>'; prev=null; }
    if(m.sys){
      h+='<div class="sys"><span class="ic"><i style="background:'+m.c+'"></i></span><div class="card">'+m.tx+(m.go?' · <a data-go="1">'+esc(m.go)+'</a>':'')+'<small>'+esc(m.meta||'Sistema')+' · '+hm(m.at)+'</small></div></div>';
      prev=null; return;
    }
    var cont = prev && prev.u===m.u && (m.at-prev.at)<5*60000, p=PEOPLE[m.u];
    h+='<div class="m'+(cont?' cont':'')+(m.u===ME?' mine':'')+(m.sending?' sending':'')+'"><span class="av sm nodot">'+ini(p.name)+'</span><div>'+
      (cont?'':'<div class="hd"><b>'+esc(m.u===ME?'Você':p.name)+'</b><time>'+hm(m.at)+'</time></div>')+
      '<div class="bd">'+fmt(m.tx)+'</div>'+(m.sending?'<div class="st">enviando…</div>':'')+'</div></div>';
    prev=m;
  });
  $('msgs').innerHTML=h||'<div class="empty">Nenhuma mensagem ainda. Comece a conversa.</div>';
  var box=$('msgs'), sep=box.querySelector('.new-sep');
  if(sep) box.scrollTop=sep.offsetTop-60; else box.scrollTop=box.scrollHeight;
}
function closeConv(){ $('cv').classList.remove('show'); open=null; $('typing').innerHTML=''; $('mPop').hidden=true; renderList(); }
function svgBell(){ return '<svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>'; }
function svgMute(){ return '<svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 9.3-5M18 8c0 7 3 9 3 9H9M3 3l18 18M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>'; }

/* ---------- Mensagens rápidas (contexto da fábrica) ---------- */
function shiftSummary(){
  var c=curShift(); var s=c?c.s.l:'Turno';
  return s+': 1/14 ordens (7%) · PD/PA 1/7 · '+(c?Math.round(c.el/c.len*100):0)+'% do turno decorrido';   // ← calcular a partir do painel real
}
function renderQuick(c){
  var Q = c.type==='ch'
    ? [['sum','Resumo do turno'],['ok','Ciente'],['nt','Citar NT']]
    : [['ok','Ciente'],['sum','Resumo do turno'],['call','Pode vir à pesagem?']];
  $('quick').innerHTML=Q.map(function(x){ return '<button data-q="'+x[0]+'">'+x[1]+'</button>'; }).join('');
}
$('quick').addEventListener('click',function(e){
  var b=e.target.closest('[data-q]'); if(!b) return; var k=b.dataset.q, t=$('inp');
  if(k==='sum') t.value=(t.value?t.value+'\n':'')+shiftSummary();
  if(k==='ok') { t.value='Ciente.'; send(); return; }
  if(k==='nt') t.value=(t.value?t.value+' ':'')+'NT ';
  if(k==='call') t.value='Pode vir à pesagem quando puder?';
  autosize(); syncSend(); t.focus();
});

/* ---------- Compositor ---------- */
function autosize(){ var t=$('inp'); t.style.height='auto'; t.style.height=Math.min(120,t.scrollHeight)+'px'; }
function syncSend(){ var v=$('inp').value.trim(); $('sendBtn').disabled=!v; $('chars').textContent=v.length>400?v.length+'/1000':''; }
var mSel=0;
function mentionCtx(){ var t=$('inp'), pos=t.selectionStart, before=t.value.slice(0,pos), m=before.match(/@([\wÀ-ú]*)$/); return m?{q:m[1],start:pos-m[0].length,end:pos}:null; }
function renderMention(){
  var ctx=mentionCtx(), pop=$('mPop'); if(!ctx){ pop.hidden=true; return; }
  var s=ctx.q.toLowerCase(), l=Object.keys(PEOPLE).filter(function(k){ return k!==ME && PEOPLE[k].name.toLowerCase().indexOf(s)>=0; })
    .sort(function(a,b){ return (PEOPLE[b].st!=='off')-(PEOPLE[a].st!=='off'); }).slice(0,6);
  if(!l.length){ pop.hidden=true; return; }
  mSel=Math.min(mSel,l.length-1); pop._l=l; pop.hidden=false;
  pop.innerHTML=l.map(function(k,i){ var p=PEOPLE[k]; return '<div class="it'+(i===mSel?' on':'')+'" data-k="'+k+'"><span class="av sm '+(p.st==='on'?'on':p.st==='away'?'away':'')+'">'+ini(p.name)+'</span>'+esc(p.name)+'<small>'+esc(p.role)+'</small></div>'; }).join('');
}
function pickMention(k){
  var ctx=mentionCtx(), t=$('inp'); if(!ctx) return;
  var first=PEOPLE[k].name.split(' ')[0];
  t.value=t.value.slice(0,ctx.start)+'@'+first+' '+t.value.slice(ctx.end);
  var p=ctx.start+first.length+2; t.setSelectionRange(p,p); $('mPop').hidden=true; autosize(); syncSend(); t.focus();
}
$('mPop').addEventListener('mousedown',function(e){ var it=e.target.closest('[data-k]'); if(it){ e.preventDefault(); pickMention(it.dataset.k); } });
$('inp').addEventListener('input',function(){ autosize(); syncSend(); mSel=0; renderMention(); if(open) store.set('cc_draft_'+open,this.value); });
$('inp').addEventListener('keydown',function(e){
  var pop=$('mPop');
  if(!pop.hidden){
    var l=pop._l||[];
    if(e.key==='ArrowDown'){ e.preventDefault(); mSel=Math.min(l.length-1,mSel+1); renderMention(); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); mSel=Math.max(0,mSel-1); renderMention(); return; }
    if(e.key==='Enter'||e.key==='Tab'){ e.preventDefault(); pickMention(l[mSel]); return; }
    if(e.key==='Escape'){ e.stopPropagation(); pop.hidden=true; return; }
  }
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
$('sendBtn').onclick=send;

/* ================= ENVIO (substituir por apiEnviar) ================= */
function send(){
  var t=$('inp'), v=t.value.trim(); if(!v||!open) return;
  var c=conv(open), m={u:ME,at:new Date(),tx:v.slice(0,1000),sending:true};
  c.msgs.push(m); c.read=c.msgs.length; t.value=''; store.set('cc_draft_'+open,''); autosize(); syncSend(); $('mPop').hidden=true;
  renderMsgs(-1);
  setTimeout(function(){ m.sending=false; if(open===c.id) renderMsgs(-1); }, 450);   // confirmação do servidor
  simulateReply(c,v);
}
// Simulação de resposta (remover em produção)
function simulateReply(c,v){
  var who = c.type==='dm' ? c.with : 'dm';
  if(PEOPLE[who].st==='off') return;
  setTimeout(function(){ if(open===c.id) $('typing').innerHTML='<span></span><span></span><span></span> '+esc(PEOPLE[who].name.split(' ')[0])+' está digitando'; },900);
  setTimeout(function(){
    $('typing').innerHTML='';
    var r = /resumo|ordens/i.test(v) ? 'Valeu. A LEG.12 já voltou, devemos recuperar até o fim do turno.' : /ciente/i.test(v) ? 'Obrigado.' : 'Certo, já vejo isso.';
    receive(c.id,{u:who,at:new Date(),tx:r});
  },2600);
}
function receive(id,m){
  var c=conv(id); c.msgs.push(m);
  if(open===id && !$('cc').hidden){ c.read=c.msgs.length; renderMsgs(-1); }
  else { if(!c.muted && sound) beep(); if(/@Johnathan/.test(m.tx)) c.mention=true; }
  renderTop(); if(!open && !$('cc').hidden) renderList();
  var cnt=$('ccCount'); cnt.classList.remove('bump'); void cnt.offsetWidth; cnt.classList.add('bump');
}
function beep(){ try{ var C=window.AudioContext||window.webkitAudioContext; if(!C) return; var a=new C(), o=a.createOscillator(), g=a.createGain();
  o.frequency.value=660; g.gain.setValueAtTime(.0001,a.currentTime); g.gain.exponentialRampToValueAtTime(.06,a.currentTime+.02); g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.2);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+.21); }catch(e){} }

/* ================= EVENTOS ================= */
function toggleCC(force){
  var show = force!=null ? force : $('cc').hidden;
  $('cc').hidden=!show; $('ccBtn').classList.toggle('on',show);
  if(show){ renderList(); if(!open) setTimeout(function(){ $('q').focus(); },30); }
}
$('ccBtn').addEventListener('click',function(e){ e.stopPropagation(); toggleCC(); });
$('cc').addEventListener('click',function(e){ e.stopPropagation(); });
document.addEventListener('click',function(){ if(!$('cc').hidden) toggleCC(false); });
$('ccClose').onclick=function(){ toggleCC(false); };
$('ccTabs').addEventListener('click',function(e){ var b=e.target.closest('[data-t]'); if(!b) return; tab=b.dataset.t; store.set('cc_tab',tab); q=''; $('q').value=''; renderList(); });
$('q').addEventListener('input',function(){ q=this.value.trim(); renderList(); });
$('q').addEventListener('keydown',function(e){ if(e.key==='Enter'){ var r=$('list').querySelector('.row'); if(r) r.click(); } });
$('list').addEventListener('click',function(e){
  var r=e.target.closest('.row'); if(!r) return;
  if(r.dataset.open) openConv(r.dataset.open);
  if(r.dataset.person){ var k=r.dataset.person, c=dmWith(k);
    if(!c){ c={id:'dm_'+k,type:'dm',with:k,msgs:[],read:0}; CONVS.push(c); }
    openConv(c.id); }
});
$('cvHead').addEventListener('click',function(e){
  if(e.target.closest('#backBtn')) closeConv();
  if(e.target.closest('#muteBtn')){ var c=conv(open); c.muted=!c.muted; toast(c.muted?'#'+c.name+' silenciado':'Notificações de #'+c.name+' reativadas'); openConv(open); }
});
$('msgs').addEventListener('click',function(e){
  var n=e.target.closest('[data-code]'); if(n){ toast('Abrir NT '+n.dataset.code+' em Gerenciar NTs'); return; }
  if(e.target.closest('[data-go]')) toast('Abrir Painel de produção');
});
function renderSound(){ $('soundBtn').innerHTML = sound ? '<svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4zM23 9l-6 6M17 9l6 6"/></svg>';
  $('soundBtn').title = sound ? 'Som ativado · clique para silenciar' : 'Som desativado · clique para ativar'; }
$('soundBtn').onclick=function(){ sound=!sound; store.set('cc_sound',sound?'1':'0'); renderSound(); toast(sound?'Som das mensagens ativado':'Som das mensagens desativado'); };
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ if(!$('mPop').hidden) return; if(open){ closeConv(); return; } if(!$('cc').hidden){ toggleCC(false); return; } }
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if(e.key==='m'||e.key==='M'){ toggleCC(); }
});
$('themeBtn').onclick=function(){ var r=document.documentElement, l=r.dataset.theme!=='light'; r.dataset.theme=l?'light':''; store.set('aw_theme',l?'light':'dark'); };

/* Simulação: mensagem chegando no canal da produção (remover em produção) */
setTimeout(function(){ receive('prod',{u:'lb',at:new Date(),tx:'COP LEG.12 liberada, retomando a Desvenlafaxina.'}); },20000);

/* ================= INIT ================= */
try{
  if(store.get('aw_theme')==='light') document.documentElement.dataset.theme='light';
  renderSound(); renderTop(); tick(); setInterval(tick,1000);
  setInterval(function(){ if(!$('cc').hidden && !open) renderList(); },60000);
  toggleCC(true);
}catch(e){ console.error(e); window.dispatchEvent(new ErrorEvent('error',{message:e.message})); }
</script>
